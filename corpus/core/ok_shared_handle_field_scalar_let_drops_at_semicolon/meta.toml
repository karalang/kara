note = "B-2026-11-17-32 follow-up: a `let` of a plain value read through the handle field, in a block and a loop: the count is given back at the `;`, so the replace runs the old child's Drop at once. Core semantics §6.2: the handle field is read as a counted copy; a borrow the binding keeps holds that count until the binding's block ends (§5.5), so replacing the field through another handle runs the old child's Drop late, never under the borrow. A binding that holds no view keeps no count past its `;`. Expected output worked by hand from the rule."
