note = "B-2026-11-17-32 follow-up: a `ref a.child.items` taken in one arm of an `if` that a `let` binds, both arms run. Core semantics §6.2: the handle field is read as a counted copy; a borrow the binding keeps holds that count until the binding's block ends (§5.5), so replacing the field through another handle runs the old child's Drop late, never under the borrow. Before, check refused it with E0516 (the count dropped at the arm's end). Expected output worked by hand from the rule."
