note = "B-2026-11-20-9: core semantics §9.6, a `MutFn` is called only through an owned binding, an `own` parameter or a `mut ref`. A bare `f: MutFn(..)` parameter is borrowed, so calling it is refused, and handing it to an `own MutFn` parameter (here `any`) is refused the same way; it was accepted. The fix declares the parameter `mut ref`. The expected.out wording of an error pin is guidance, not a byte oracle."
