note = "design.md § `Iterator` and `Iterable`: an `Iterator` is consumed by `for`, and `for x in it.by_ref()` loops without consuming it. A bare parameter is a borrow, so the loop is refused at `it` with `own I` as the fix-it. The expected.out wording of an error pin is guidance, not a byte oracle."
