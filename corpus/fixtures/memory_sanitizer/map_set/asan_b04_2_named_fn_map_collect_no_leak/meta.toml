note = "B-2026-11-20-100: core semantics §3.7, `w.iter()` lends `ref String` items and `tag` takes `own String`, so `.map(tag)` would move each item out of the Vec; E0200 in karac check as the closure form `.map(|s| tag(s))` is, and the build refused it in IterMap.next. `.map(nlen)` (a bare, borrowing parameter) is fine. The expected.out wording of an error pin is guidance, not a byte oracle."
