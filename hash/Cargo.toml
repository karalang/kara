[package]
name = "karac-hash"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

# ZERO DEPENDENCIES, deliberately. This crate is linked into BOTH the `karac`
# compiler (for the interpreter's `Map`/`Set`) and `karac-runtime` (for the
# compiled backends' `karac_map_*` tables), and the runtime has to build for
# wasm32-wasip1, wasm32-wasip1-threads and Cortex-M as well as native. Anything
# added here has to clear that whole target matrix, so the bar for a dep is:
# there isn't one.
[dependencies]

[features]
# `std` is what the native environment override and entropy fallback need. ON
# by default for the compiler and the native runtime; the runtime's wasm and
# embedded archives turn it off. On WASI the seed still comes from
# `random_get` and the override from `environ_get` (B-2026-11-17-64); only an
# embedded build falls back to a fixed key (see `seed.rs`).
default = ["std"]
std = []

# Runs on the MAIN thread, which is the only place the defect it guards shows
# (see the file's header).
[[test]]
name = "seed_alloc"
harness = false

# Spawns its own child processes, each racing threads to the first hash.
[[test]]
name = "seed_race"
harness = false
