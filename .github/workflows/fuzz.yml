name: Fuzz

# Both of this repo's fuzzing assets were built, used to good effect, and
# then left as manual one-off commands:
#
#   * `fuzz/fuzz_targets/*` — three libFuzzer targets asserting the
#     front-end never panics on arbitrary input (lexer, parser, and the
#     full resolve → typecheck → effect → ownership pipeline).
#   * `scripts/fuzz/drop_fuzz.py` — the drop-soundness fuzzer
#     (B-2026-11-02-22; the v2 port of the legacy `src/bin/drop_fuzz.rs`,
#     deleted with the legacy pipeline at M3). It generates well-typed
#     heap-core Kāra programs, runs each on the MIR interpreter and
#     through `karac __mir-llvm-asan` in order and with auto-par on four
#     workers, and judges them with ASan + LSan, a drop-token log (the
#     only instrument that sees a user `impl Drop` body run twice or not
#     at all while the heap is still freed correctly), and agreement
#     with the interpreter's output.
#
# Neither ran on a schedule, so both measurements were only ever as fresh
# as the last time someone remembered. That matters here more than in most
# projects: the bug ledger's largest classes by far are the exact ones
# these two target — miscompile / leak / double-free / use-after-free /
# crash — and codegen is still the surface where most of them land.
#
# This workflow runs both nightly and on demand. It is intentionally NOT
# a pull-request gate: fuzzing is a time-boxed search, so a green run
# proves nothing about a specific diff and a red one usually needs
# triage rather than a revert. Nightly is where that trade works.
on:
  schedule:
    # 04:00 UTC daily — off-peak for the shared runner pool.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      libfuzzer_seconds:
        description: "Seconds per libFuzzer front-end target"
        required: false
        default: "300"
      drop_fuzz_count:
        description: "Programs for the drop-soundness fuzzer"
        required: false
        default: "600"

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Front-end panic-freedom (libFuzzer) ────────────────────────────
  # Cheap by comparison: no codegen, no linking, no sanitizer runtime —
  # just "the front end must return diagnostics, never panic, on
  # arbitrary bytes". Each target is time-boxed so the matrix finishes
  # in a predictable window.
  front-end:
    name: Front-end panic-freedom (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_lexer, fuzz_parser, fuzz_pipeline]

    steps:
      - uses: actions/checkout@v4

      # cargo-fuzz requires a nightly toolchain for `-Z sanitizer`.
      # RUSTUP_TOOLCHAIN overrides rust-toolchain.toml's pin, which
      # exists for reproducibility of the shipped build and has no
      # bearing on the fuzzer.
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz

      - name: Fuzz ${{ matrix.target }}
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: |
          cargo fuzz run ${{ matrix.target }} -- \
            -max_total_time=${{ github.event.inputs.libfuzzer_seconds || '300' }} \
            -print_final_stats=1

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 30

  # ── Drop soundness (ASan + LSan + drop-token log, B-2026-11-02-22) ──
  # LSan ships with upstream LLVM's ASan on Linux and not on macOS, so
  # this must run on a Linux runner to judge leaks at all.
  drop-soundness:
    name: Drop soundness (drop_fuzz, ASan + LSan)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 18
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 llvm-18-dev
          echo "LLVM_SYS_181_PREFIX=$(llvm-config-18 --prefix)" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      # `__mir-llvm-asan` links these; without them every compiled
      # surface fails to link and the run is void (exit 2), not green.
      - name: Build runtime archives (lean, then full)
        run: |
          cargo rustc -p karac-runtime --release --no-default-features --features net --crate-type staticlib
          cp target/release/libkarac_runtime.a target/release/libkarac_runtime_min.a
          cargo rustc -p karac-runtime --release --crate-type staticlib

      - name: Build karac
        run: cargo build --release --features llvm

      # A planted double drop must be reported on all three surfaces
      # before a clean run means anything.
      - name: Prove the drop-log oracle reports
        run: python3 scripts/fuzz/drop_fuzz.py --canary

      - name: Run the drop-soundness fuzzer
        run: |
          python3 scripts/fuzz/drop_fuzz.py \
            --count "${{ github.event.inputs.drop_fuzz_count || '600' }}" \
            --seed "$(( $(date +%s) / 86400 * 1000 ))" \
            --out target/drop-fuzz

      - name: Upload shrunk repros and the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drop-fuzz
          path: target/drop-fuzz
          if-no-files-found: ignore
          retention-days: 30
