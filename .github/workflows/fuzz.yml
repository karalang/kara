name: Fuzz

# Both of this repo's fuzzing assets were built, used to good effect, and
# then left as manual one-off commands:
#
#   * `fuzz/fuzz_targets/*` — three libFuzzer targets asserting the
#     front-end never panics on arbitrary input (lexer, parser, and the
#     full resolve → typecheck → effect → ownership pipeline).
#   * (Removed 2026-11-02.) The legacy drop-soundness fuzzer,
#     `src/bin/drop_fuzz.rs` + `scripts/drop-fuzz.sh`, was deleted with the
#     legacy pipeline at M3 (9ed792e373), and its job here failed with exit
#     127 on every nightly run since. Porting it to v2 (generate heap-core
#     programs, build through MIR, judge under ASan + LSan and a drop-token
#     log on the MIR interpreter) is tracked in the bug ledger. Until then
#     the ASan corpus lane (`karac __mir-llvm-asan`) is the drop gate.
#   * (Historical description of the removed fuzzer follows.) The drop-soundness
#     fuzzer: it generates well-typed heap-core Kāra programs, compiles
#     each through the real AOT path, links under ASan + LSan, runs it,
#     and lets the sanitizer judge. It also runs each program on the
#     interpreter and checks a drop-token log, which is what covers user
#     `impl Drop` bodies — no sanitizer can see a destructor that runs
#     twice or not at all while the heap is still freed correctly.
#     (docs/spikes/ownership-model-mechanization.md. The "0 bugs over
#     ~2500 executions" figure recorded there predates the drop-log
#     oracle and describes the implicit-drop heap core only — see the
#     scope correction under it.)
#
# Neither ran on a schedule, so both measurements were only ever as fresh
# as the last time someone remembered. That matters here more than in most
# projects: the bug ledger's largest classes by far are the exact ones
# these two target — miscompile / leak / double-free / use-after-free /
# crash — and codegen is still the surface where most of them land.
#
# This workflow runs both nightly and on demand. It is intentionally NOT
# a pull-request gate: fuzzing is a time-boxed search, so a green run
# proves nothing about a specific diff and a red one usually needs
# triage rather than a revert. Nightly is where that trade works.
on:
  schedule:
    # 04:00 UTC daily — off-peak for the shared runner pool.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      libfuzzer_seconds:
        description: "Seconds per libFuzzer front-end target"
        required: false
        default: "300"

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Front-end panic-freedom (libFuzzer) ────────────────────────────
  # Cheap by comparison: no codegen, no linking, no sanitizer runtime —
  # just "the front end must return diagnostics, never panic, on
  # arbitrary bytes". Each target is time-boxed so the matrix finishes
  # in a predictable window.
  front-end:
    name: Front-end panic-freedom (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_lexer, fuzz_parser, fuzz_pipeline]

    steps:
      - uses: actions/checkout@v4

      # cargo-fuzz requires a nightly toolchain for `-Z sanitizer`.
      # RUSTUP_TOOLCHAIN overrides rust-toolchain.toml's pin, which
      # exists for reproducibility of the shipped build and has no
      # bearing on the fuzzer.
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz

      - name: Fuzz ${{ matrix.target }}
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: |
          cargo fuzz run ${{ matrix.target }} -- \
            -max_total_time=${{ github.event.inputs.libfuzzer_seconds || '300' }} \
            -print_final_stats=1

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 30
