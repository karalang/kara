name: Compile Speed

# Phase 8.5 Track 5: cold compile-elapsed gate. PRs are gated on the
# karac/rustc RATIO per corpus workload vs bench/compile_speed/baseline.json
# (30% initial threshold — catches order-of-magnitude blowups like the
# 2026-05-12 Maranget O(N²) shape without flaking on routine work; tightens
# as data accumulates). Pushes to main re-measure and refresh the baseline
# when a ratio drifted >5%.

on:
  pull_request:
  push:
    branches: [main]
    # A baseline refresh commit must not retrigger a run of itself.
    paths-ignore:
      - 'bench/compile_speed/baseline.json'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: compile-speed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: Cold compile-elapsed (gate on PR, baseline on main)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Same LLVM 18.1 setup as codegen-e2e (see ci.yml for rationale);
      # hyperfine rides the same apt transaction.
      - name: Install LLVM 18 + hyperfine
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 llvm-18-dev hyperfine
          echo "LLVM_SYS_181_PREFIX=$(llvm-config-18 --prefix)" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(llvm-config-18 --libdir)" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: compile-speed

      # The bench measures the RELEASE karac (the artifact users get), which
      # links the runtime archive on every `karac build`.
      - name: Build release karac + runtime archive
        run: |
          cargo build --release --features llvm --bin karac
          cargo rustc -p karac-runtime --release --crate-type staticlib

      - name: Run bench (twin oracle + hyperfine)
        run: ./bench/compile_speed/bench.sh

      - name: Gate vs baseline
        if: github.event_name == 'pull_request'
        run: |
          cd bench/compile_speed
          set +e
          python3 compare.py --latest latest.json --baseline baseline.json --markdown gate.md
          rc=$?
          cat gate.md >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      # Sticky PR comment (same-repo PRs only — fork tokens are read-only).
      - name: PR comment
        if: >-
          always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'bench/compile_speed/gate.md';
            if (!fs.existsSync(path)) return;
            const marker = '<!-- compile-speed-gate -->';
            const body = fs.readFileSync(path, 'utf8') + '\n' + marker;
            const {data: comments} = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const prev = comments.find(c => c.body.includes(marker));
            if (prev) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: prev.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: context.issue.number, body,
              });
            }

      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-speed-${{ github.run_id }}
          path: |
            bench/compile_speed/latest.json
            bench/compile_speed/gate.md
          if-no-files-found: ignore

      # main is a protected branch (required status checks), so the refresh
      # rides a PR from a well-known branch instead of a direct push — and that
      # PR turns on auto-merge, so it lands itself once the checks go green and
      # nobody has to shepherd it. Direct-push was considered and rejected: it
      # would need a protection bypass for the workflow token, and the PR leg
      # already runs the full required-check set (verified on #4/#5), so
      # auto-merge buys the same zero-touch refresh at no such cost.
      #
      # The refresh trigger is scoped to `synthetic` (--refresh-on): the tiny
      # seed_kata's between-run variance exceeds 5%, so it would otherwise
      # churn the baseline every run — it stays in the gate (30% threshold,
      # far above its noise) but doesn't drive refreshes. Every refresh still
      # writes ALL workloads' fresh numbers.
      #
      # Failing to open or queue the PR is a hard ERROR, never a warning. This
      # step is the only thing keeping the gate's reference honest, and a green
      # run over a stranded baseline branch (2026-07-30 and -31, while 'Allow
      # GitHub Actions to create and approve pull requests' was off) reads as
      # "nothing to do" while the gate silently measures against stale numbers.
      - name: Refresh baseline (auto-merging PR on drift)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd bench/compile_speed
          python3 compare.py --latest latest.json --write-baseline baseline.json \
            --refresh-on synthetic --drift-out drift.md
          if git diff --quiet baseline.json; then
            echo "baseline current — no PR needed"
            exit 0
          fi
          cat drift.md >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B bench/compile-speed-baseline
          git add baseline.json
          git commit -m "bench(compile-speed): refresh baseline from main run ${{ github.run_id }}"
          git push -f origin bench/compile-speed-baseline

          # The drift record rides in the PR body: this lands unattended, so
          # which way each ratio moved has to survive into merged history
          # rather than living only in this job's log.
          {
            echo "Automated baseline refresh from the main-leg run of commit ${{ github.sha }} — a karac/rustc ratio drifted >5% from the stored baseline. Merging keeps the compile-speed gate honest."
            echo
            cat drift.md
          } > pr-body.md

          url=$(gh pr create \
            --base main --head bench/compile-speed-baseline \
            --title "bench(compile-speed): refresh baseline" \
            --body-file pr-body.md 2> gh-err.txt) || {
              if grep -qi "already exists" gh-err.txt; then
                echo "PR already open — the force-push updated it"
                url=$(gh pr list --head bench/compile-speed-baseline \
                  --state open --json url --jq '.[0].url')
              else
                cat gh-err.txt >&2
                echo "::error::Could not open the baseline PR — check that repo" \
                  "setting 'Allow GitHub Actions to create and approve pull" \
                  "requests' is enabled. The refreshed baseline is stranded on" \
                  "branch bench/compile-speed-baseline until it is."
                exit 1
              fi
            }

          # --auto merges it as soon as the required checks pass, and leaves it
          # open and visible if any of them fail.
          gh pr merge --auto --squash "$url" || {
            echo "::error::Opened $url but could not enable auto-merge — check" \
              "that 'Allow auto-merge' is enabled on the repository."
            exit 1
          }
          echo "baseline PR queued for auto-merge: $url"
