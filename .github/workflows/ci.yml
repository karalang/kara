name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly backfill: `cancel-in-progress` (below) deliberately trades
  # per-commit signal on `main` for queue health, so a push burst can leave
  # the final main state as the only tested commit — and a red intermediate
  # state invisible. A scheduled full run every 6 hours guarantees main gets
  # a complete, uncancelled verdict regardless of the push pattern
  # (project-review-2026-08-16 item 6; every 6 h since 2026-10-26, ADR-1
  # revisit: a daily run covered ~200 commits and let a red sit ~19 h).
  # :17 past the hour, off the :00 spike.
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# One CI run per ref at a time; a new push cancels the run it supersedes.
#
# WITHOUT THIS the workflow's 20 jobs are spawned per push with nothing
# superseding anything, and at this repo's push rate the matrix multiplies
# faster than the runner pool drains. Measured 2026-08-06 on `main`: six runs
# queued simultaneously (oldest 1h45m), and in the last two runs to reach a
# conclusion, ELEVEN of 25 jobs failed at "Set up job" as their only step (no
# runner assigned) while six more were cancelled after 1-2 hours queued. Every
# job that got a runner passed — so the red was starvation, not tests.
#
# THE TRADE, taken deliberately: `cancel-in-progress` on `main` means an
# intermediate commit can be superseded before its jobs finish, so per-commit
# signal is not guaranteed there. That is worth it only because the starved
# alternative gave no signal at ALL — a cancelled job and a green one are not
# distinguishable at a glance, which is how a red `main` can look tested. If
# the push rate ever drops back to human pace, prefer
# `cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}` so `main` keeps
# a result per commit.
#
# This is also the prerequisite for promoting any job here to a REQUIRED check
# (B-2026-08-04-17 wants `memory-sanitizer-o0` required): required checks gate
# direct pushes to a protected branch, not just PR merges, and this repo
# commits straight to `main` — so a check that cannot get a runner would block
# every contributor rather than merely delay them.
concurrency:
  # Keyed by event too, so the nightly `schedule` run gets its own group: a
  # backfill run must neither cancel nor be cancelled by a push run — pushes
  # still supersede pushes, PRs still supersede PRs, per ref.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --all

      - name: Run tests
        run: cargo test --all

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # `Bug-ledger integrity` below resolves every SHA a `fix` field cites
          # against this repo's history. `actions/checkout` is depth-1 by
          # DEFAULT, and in a shallow clone essentially no cited SHA is present
          # — the check would either report ~900 false violations or (as it
          # actually does) detect the shallow clone and skip itself, which
          # would leave the rule enforced only on developer machines. That is
          # the same "convention nobody can check" shape that let the ledger's
          # JSON encoding drift four times in one day (B-2026-08-07-13).
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      # Pure-python, no build — runs before the Rust gates so a scorer-logic
      # regression fails in seconds. The Mend scorer produces the AI-first
      # wedge's headline numbers, and its failure mode is silent: B-2026-08-02-1
      # understated fix precision for weeks because the bias only fires on
      # multi-phase programs, which a single-mistake corpus never produces.
      - name: Mend scorer self-test
        run: python3 examples/mend/harness/test_mend_score.py

      # Also pure-python and also seconds. The ledger's integrity rules
      # (B-ID uniqueness, the controlled class/severity/surface/source enums,
      # canonical JSON encoding) were "enforced" only by an instruction in the
      # PR template and CLAUDE.md, which is how the encoding drifted four times
      # in one day (B-2026-08-07-13) — a convention nobody can check is a
      # convention that rots. The cross-repo kata link check needs kara-katas,
      # which CI does not have; it degrades to a warning there rather than a
      # failure, so this gate covers the same-repo rules only.
      - name: Bug-ledger integrity
        run: ./scripts/bug-lint.sh

      # Rule 6b (the fix-SHA orphan detector) fails SILENTLY when it breaks: a
      # lint that checks nothing is indistinguishable from one that finds
      # nothing, which is how rule 6 stayed skipped in every cloud container for
      # months (B-2026-09-16-8). This builds a throwaway SHALLOW clone, orphans
      # a commit in it the way a rebase does, and asserts the lint catches it —
      # so the gate that guards the ledger's traceability is itself guarded.
      - name: Bug-ledger rule-6b selftest
        run: ./scripts/bug-lint-selftest.sh

      # Pure-python and milliseconds — it parses this file and greps tests/,
      # it does not build. Answers "which `#[cfg(feature = "llvm")]` tests does
      # no CI job run?", which was previously answerable only by redoing a
      # manual sweep. Both prior dark-target rows (B-2026-07-31-44, 554 tests;
      # B-2026-08-08-26, 35 more) were found by someone noticing a local
      # failure CI did not have — luck that only pays out when a dark test is
      # already RED. This one reports them while they are still green.
      - name: Dark llvm test targets
        run: python3 scripts/dark-llvm-tests.py

      - name: Check formatting
        run: cargo fmt --all -- --check

      # `--all-targets` so the cfg(test) surface is linted here too, matching
      # the CLAUDE.md local gate — without it, test-target-only lints on the
      # non-llvm build were enforced only by the non-blocking drift canary.
      - name: Clippy
        run: cargo clippy --all --all-targets -- -D warnings

      - name: Codegen containment guard
        run: |
          violations=$(grep -rlE '^\s*use\s+inkwell|\b(LLVMValue|LLVMType|BasicValueEnum|BasicTypeEnum)\b' src/ | grep -vE '^src/backend/' || true)
          if [ -n "$violations" ]; then
            echo "::error::Codegen containment violation — LLVM/inkwell references outside src/backend/:"
            echo "$violations"
            echo "See docs/design.md § Codegen architecture and CLAUDE.md § Architecture > Codegen containment."
            exit 1
          fi

  # Clippy for the `#[cfg(windows)]` runtime surface the native `lint` job
  # (ubuntu-only) structurally cannot see. The Windows IOCP event-loop, TLS,
  # and fatal-path bodies (`runtime/src/{event_loop,tls,fatal}.rs` — the
  # Windows IOCP port, docs/spikes/windows-iocp-eventloop.md) are gated behind
  # `#[cfg(windows)]`, so `cargo clippy` on a Linux runner never type-checks —
  # let alone lints — them. They were authored and fixed natively on a Windows
  # box, where 6 pre-existing `missing_safety_doc` lints on the WS FFIs only
  # surfaced; this job keeps that surface green going forward (mirrors the
  # per-target `wasm` clippy job's rationale). Scope: the runtime crate with
  # its full native feature set (`tls,net` + `test-helpers` for the test-only
  # FFI's Windows body) — the exact set validated clean on the box. The
  # `#[cfg(windows)]` codegen linker driver (`src/codegen/driver.rs`) is
  # `--features llvm`-gated and stays uncovered until the broader "LLVM in CI"
  # decision puts LLVM 18 on the Windows runner (the documented yak-shave the
  # spike defers — same reason the codegen E2E jobs are Linux-only). That
  # uncovered surface now also includes the producer-mode library link arms
  # (`link_static_library` / `link_shared_library` Windows branches +
  # `NativeLibKind::artifact_extension`, additive-interop Tier 5): `.lib`/`.dll`
  # emission via `llvm-ar` / `clang -shared` with a `/EXPORT:`-per-symbol list.
  # They mirror this file's proven `link_executable_windows` toolchain
  # conventions; a Windows `codegen-lint` job (clippy `--features llvm` on
  # windows-latest, mirroring the Linux `codegen-lint` below) is the intended
  # first coverage step once LLVM 18 lands on the Windows runner.
  windows-lint:
    name: Windows clippy (cfg(windows) surface)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-lint

      - name: Clippy (cfg(windows) runtime surface)
        run: cargo clippy -p karac-runtime --all-targets --features tls,net,test-helpers -- -D warnings

  # Wasm runtime surface that the native `lint` / `test` jobs never see
  # (B-2026-06-12-2). `cargo clippy --all` runs on the host target only, so a
  # wasm-cfg'd lint — e.g. the `clashing_extern_declarations` malloc clash that
  # drifted red unnoticed (B-2026-06-11-9) — is invisible to it; and the
  # default build job never exercises the no-default-features wasm archives, so
  # a wasm-only break (a non-wasm dep creeping into the default set, a cfg typo)
  # slips through. This job gates both wasm clippy arms and both wasm staticlib
  # archive builds (the CLAUDE.md § "Four archives" wasm legs). It needs neither
  # LLVM nor node — the `--features llvm` wasm E2E run (which would also catch
  # the codegen-side size_t-width trap class, B-2026-06-12-1) is gated on the
  # broader "LLVM in CI" decision that keeps all codegen E2E out of CI today.
  wasm:
    name: WASM (clippy + archives)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1, wasm32-wasip1-threads
          components: clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      # The sequential (net-free) archive's clippy surface. `-D warnings` is
      # the gate the local CLAUDE.md recipe assumes but CI never ran.
      - name: Clippy (wasm32-wasip1)
        run: cargo clippy -p karac-runtime --target wasm32-wasip1 --no-default-features -- -D warnings

      # The threaded sibling (wasi-threads ABI; its sysroot is the only one
      # whose wasi-libc carries atomics). Separate cfg surface, separate lint.
      - name: Clippy (wasm32-wasip1-threads)
        run: cargo clippy -p karac-runtime --target wasm32-wasip1-threads --no-default-features --features wasm-threads -- -D warnings

      # The two wasm staticlib legs of the four-archive recipe — proves they
      # still build (a warn-level extern clash links but a real cfg/dep break
      # would fail here, where the native build job can't see it).
      - name: Build wasm staticlib archives
        run: |
          cargo rustc -p karac-runtime --release --target wasm32-wasip1 --no-default-features --crate-type staticlib
          cargo rustc -p karac-runtime --release --target wasm32-wasip1-threads --no-default-features --features wasm-threads --crate-type staticlib

  # Tier 3 of the CI-coverage plan (docs/spikes/ci-test-coverage.md) — the wasm
  # E2E + component leg, the last open tier. The `wasm` job above proves the
  # archives BUILD; this one proves compiled programs RUN: `karac build
  # --target=wasm_wasi` through componentization (`wasm-tools`), execution
  # under node's `node:wasi` host, and the browser/threads dual-artifact
  # surface — the leg that would have caught the `karac_alloc_or_panic`
  # `size_t` trap, which was invisible to clippy and only manifested at wasm
  # runtime. Proven before landing: 71/71 locally with this exact recipe — and
  # the FIRST local run failed, because the component fixture had silently
  # stopped typechecking when implicit i64→i32 narrowing became an error;
  # nothing ran these tests anywhere, so nothing noticed. That is the drift
  # class this job exists to close.
  #
  # Deliberately NON-required, per the spike's own rule: node:WASI version
  # drift is a known flake source, and required-but-flaky teaches everyone to
  # ignore red. Flip after a stable green history.
  wasm-e2e:
    name: WASM E2E (build + component + node:wasi run)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Same LLVM recipe as codegen-e2e: the `karac` binary itself needs
      # --features llvm to emit wasm objects.
      - name: Install LLVM 18
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 llvm-18-dev
          echo "LLVM_SYS_181_PREFIX=$(llvm-config-18 --prefix)" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(llvm-config-18 --libdir)" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1, wasm32-wasip1-threads

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm-e2e

      # Prebuilt binary — `cargo install wasm-tools` would add ~3 min of
      # compile to every run for the same executable.
      - name: Install wasm-tools
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools

      # All four archives from the CLAUDE.md recipe. The wasm pair is what
      # `--target=wasm_wasi` / `wasm_browser` links; the native lean→full pair
      # is there so any natively-building test in the filtered set links real
      # binaries instead of vacuously skipping. Order matters: lean and wasm
      # builds emit the canonical libkarac_runtime.a name, so each is copied
      # aside before the full native build overwrites it last.
      - name: Build runtime archives (wasm pair + native lean → full)
        run: |
          mkdir -p target/release
          cargo rustc -p karac-runtime --release --target wasm32-wasip1 --no-default-features --crate-type staticlib
          cp target/wasm32-wasip1/release/libkarac_runtime.a target/release/libkarac_runtime_wasm.a
          cargo rustc -p karac-runtime --release --target wasm32-wasip1-threads --no-default-features --features wasm-threads --crate-type staticlib
          cp target/wasm32-wasip1-threads/release/libkarac_runtime.a target/release/libkarac_runtime_wasm_threads.a
          cargo rustc -p karac-runtime --release --no-default-features --features net --crate-type staticlib
          cp target/release/libkarac_runtime.a target/release/libkarac_runtime_min.a
          cargo rustc -p karac-runtime --release --crate-type staticlib

      # node is preinstalled on ubuntu-latest; the tests self-report the
      # version on a node:wasi failure so a host-drift flake is attributable.
      - name: WASM E2E (cargo test --test cli wasm)
        run: cargo test --features llvm --test cli wasm

      # `build --mir --target=wasm_wasi`: the MIR backend's wasm32 module,
      # run under node's WASI against the native output (B-2026-10-22-23).
      - name: WASM E2E on MIR (cargo test --test mir_wasm)
        run: cargo test --features llvm --test mir_wasm

  # The `--features llvm` codegen surface — the load-bearing correctness gate
  # that, until now, ran ZERO times in CI (`test` runs `cargo test --all`, no
  # `--features llvm`, so the real-binary codegen E2E + the self-hosting oracle
  # were never gated; two wasm bugs drifted in through exactly this hole). Tier 1
  # scope: the deterministic, dependency-light binaries — codegen E2E,
  # interpreter, typechecker, and the differential self-host lexer oracle. The
  # archives must exist or the E2E binaries vacuously skip, so build the native
  # lean→full pair first (codegen links them). Deliberately NOT here yet:
  # memory_sanitizer (needs an ASAN cc — Tier 2) and the wasm/component E2E
  # (needs node + wasm-tools + the wasm archives — Tier 3, B-2026-06-12-2 leg 3).
  # Provenance guard: the self-hosted-lexer oracle (tests/selfhost_lexer.rs) is
  # a DIFFERENTIAL oracle — it only catches port drift on behaviour its corpus
  # exercises. A seed change to src/lexer.rs with no matching corpus input lets
  # the Kāra port silently diverge while the oracle stays green (how commits
  # 3311df6d / 99131a7b drifted — fixed in follow-on #31). This job fails when
  # src/lexer.rs changes without tests/selfhost_lexer.rs over the push/PR range,
  # so the seed and the oracle corpus are forced to move together. Escape
  # hatches (whitespace/format-only diff, or a [skip-oracle-sync] commit marker)
  # let genuinely oracle-irrelevant lexer edits through — see the script header.
  oracle-sync:
    name: Oracle corpus sync guard
    runs-on: ubuntu-latest
    # A diff-range guard needs a range: on the nightly/dispatch backfill there
    # is no before..after to compare (github.event.before is empty), so the
    # job would run the script against a bogus base. Push/PR runs keep it.
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          # The guard diffs across the push/PR range, so it needs full history,
          # not the default depth-1 shallow clone (a shallow clone has no
          # merge-base to compare against).
          fetch-depth: 0

      - name: Enforce seed↔oracle corpus sync
        # On a PR, compare the PR base branch tip against the head SHA; on a
        # push, compare the push's before..after. The script merge-bases the two
        # internally and applies the escape hatches.
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/oracle-sync-guard.sh

  # design.md is the authoritative language spec, and its ```kara blocks are the
  # part of it a machine can read. 12% of the bug ledger (176 rows, 62 of them
  # high-severity) is some form of "design.md says X, the implementation does Y"
  # — found, until now, one hand-read section at a time. This job feeds every
  # block to `karac check` and compares the outcome against a checked-in
  # baseline, so a spec change that the compiler cannot honour, or a compiler
  # change that breaks a documented example, fails the build instead of waiting
  # to be noticed. Front-end only: `karac check` never touches the LLVM backend,
  # so this needs no `--features llvm` and no runtime archives.
  design-conformance:
    name: design.md conformance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build karac
        run: cargo build --bin karac

      - name: Check design.md examples against the compiler
        # Fails on any block that is newly non-conforming — a block not in
        # docs/design-conformance-baseline.json that karac does not accept.
        # Blocks that START conforming are reported too (as FIXED) but do not
        # fail the build; drop them from the baseline in the same PR.
        run: python3 scripts/design-conformance.py --check

  # The `--features llvm` clippy surface — the ENTIRE codegen backend
  # (`src/codegen.rs` + every `src/codegen/*.rs`, the largest and most
  # actively-developed part of the compiler) is gated behind
  # `#[cfg(feature = "llvm")]`, so the native `lint` job's
  # `cargo clippy --all -- -D warnings` (no `--features llvm`) never compiles —
  # let alone lints — a single line of it. That hole let a `doc_lazy_continuation`
  # lint sit undetected in `src/codegen/column.rs` (a wrapped `//!` doc line
  # whose continuation read as a markdown bullet) until a local
  # `cargo clippy --all --all-targets --features llvm` run caught it. This job
  # closes the gap with the SAME LLVM-18.1 install as `codegen-e2e` below
  # (inkwell → llvm-sys needs `llvm-config-18` + libLLVM-18.so), plus the
  # `clippy` component the bare `codegen-e2e` job omits. `--all-targets` keeps
  # the `#[cfg(feature = "llvm")]` test targets (`tests/cli.rs`,
  # `tests/run_v2.rs`, the `tests/mir_*.rs` set) under the gate too —
  # see CLAUDE.md § "Use `--all-targets`, not `--tests`". No runtime staticlib
  # archives are needed here: clippy type-checks but never links or runs a
  # binary, so the lean→full archive dance the E2E jobs do is unnecessary.
  # This is the codegen sibling of the per-target `wasm` and `windows-lint`
  # clippy jobs — each gates a cfg surface the ubuntu-native `lint` can't see.
  codegen-lint:
    name: Codegen clippy (LLVM 18)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Mirror codegen-e2e's LLVM-18.1 setup. clippy is a check build (no final
      # link), so libLLVM-18.so isn't strictly loaded, but llvm-sys's build
      # script invokes `llvm-config-18`; install `llvm-18-dev` and export the
      # prefix it queries. LD_LIBRARY_PATH is kept for parity with the E2E jobs.
      - name: Install LLVM 18
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 llvm-18-dev
          echo "LLVM_SYS_181_PREFIX=$(llvm-config-18 --prefix)" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(llvm-config-18 --libdir)" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: llvm-clippy

      - name: Clippy (--features llvm codegen backend)
        run: cargo clippy --all --all-targets --features llvm -- -D warnings

  codegen-e2e:
    name: Codegen E2E (LLVM 18)
    runs-on: ubuntu-latest
    env:
      # This job builds the runtime archives itself, so a link soft-skip here
      # can only mean the archive step broke — fail loudly instead of green-
      # skipping the E2E suite (project-review-2026-08-16 item 4; the absent-
      # archive half of the B-2026-07-28-1 vacuous-pass hole).
      KARAC_REQUIRE_RUNTIME_ARCHIVE: "1"

    steps:
      - uses: actions/checkout@v4

      # inkwell `llvm18-1-prefer-dynamic` + llvm-sys `181` → LLVM 18.1, linked
      # dynamically (libLLVM-18.so must be present at build AND run time).
      # ubuntu-latest ships LLVM 18.1 in apt — more deterministic than the
      # install-action's prebuilt layout, whose tree the llvm-sys build script
      # couldn't find `llvm-config` in. `llvm-18-dev` provides `llvm-config-18`
      # + `libLLVM-18.so` + headers; export the prefix llvm-sys queries and the
      # libdir the test binaries load the shared lib from (both job-wide via
      # GITHUB_ENV).
      - name: Install LLVM 18
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 llvm-18-dev
          echo "LLVM_SYS_181_PREFIX=$(llvm-config-18 --prefix)" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(llvm-config-18 --libdir)" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: llvm-e2e

      # Real-binary E2E + the self-host oracle build via `karac build` and link
      # the runtime staticlib; without it they skip (vacuous pass). Lean first,
      # copied to the `_min` sibling, THEN full overwrites the canonical name —
      # the order matters (CLAUDE.md § "Four archives").
      # regex + arrow opt-in archives added alongside lean/full: with
      # KARAC_REQUIRE_RUNTIME_ARCHIVE=1 the Regex / Arrow-IPC E2E fixtures
      # hard-require them — before the gate they LOOKED covered but
      # green-skipped here (the archives were never built in CI, so those
      # tests never ran). Build order per CLAUDE.md § "Four archives": every
      # build emits the canonical name, so each rename happens before the
      # next build, and the plain full build runs LAST so the canonical
      # archive ends up as the non-opt-in full one.
      - name: Build runtime staticlib archives (lean → regex → arrow → unicode → full)
        run: |
          cargo rustc -p karac-runtime --release --no-default-features --features net --crate-type staticlib
          cp target/release/libkarac_runtime.a target/release/libkarac_runtime_min.a
          cargo rustc -p karac-runtime --release --features regex --crate-type staticlib
          cp target/release/libkarac_runtime.a target/release/libkarac_runtime_regex.a
          cargo rustc -p karac-runtime --release --features arrow --crate-type staticlib
          cp target/release/libkarac_runtime.a target/release/libkarac_runtime_arrow.a
          cargo rustc -p karac-runtime --release --features unicode --crate-type staticlib
          cp target/release/libkarac_runtime.a target/release/libkarac_runtime_unicode.a
          cargo rustc -p karac-runtime --release --crate-type staticlib

      - name: v2 E2E + self-host oracle
        # Every target with `#[cfg(feature = "llvm")]` code runs here: the
        # plain `cargo test --all` job builds without the feature, so a target
        # left off this list is compiled to nothing and reports green
        # (`scripts/dark-llvm-tests.py`, in the lint job, checks the list). The
        # legacy targets went with the legacy pipeline at M3.
        run: cargo test --features llvm --no-fail-fast --lib --test typechecker --test selfhost_lexer --test selfhost_parser --test selfhost_parser_items --test selfhost_parser_types --test selfhost_resolver --test selfhost_typechecker --test http_server --test tangle_corpus --test cli --test example_packages --test safety_design --test safety_design_loop --test scaffold --test mir_asan --test mir_build --test mir_for_element_views --test mir_returned_closures --test mir_escaping_captures --test mir_contract_predicate --test mir_error_trace --test mir_hasher_fields --test mir_hasher_returns --test mir_hasher_turbofish --test mir_hasher_in_type --test mir_hasher_runs_code --test mir_table_key_part_eq --test mir_open_value_needle --test mir_error_trace_tasks --test mir_site_thread_local --test mir_closure_returns_closure --test mir_io --test mir_tasks --test mir_tasks_io --test mir_pool_wait --test mir_select --test mir_deadline --test mir_tls_ws --test mir_process_sigpipe --test mir_par_for_tasks --test mir_auto_par --test mir_auto_par_cost --test mir_auto_par_nested_reduction --test mir_auto_par_constants --test mir_auto_par_wide_sums --test mir_auto_par_wasm --test mir_auto_par_one_worker --test mir_auto_par_receiver_writes --test mir_auto_par_log --test mir_widen_lent_numbers --test mir_tuple_match_in_place --test mir_trait_method_named_apart --test mir_error_trace_context --test mir_regex --test mir_json --test mir_crypto --test mir_std_streams --test mir_provider_overrides --test mir_network_provider --test mir_normalize --test mir_collections --test mir_mutex --test mir_unroll --test mir_unroll_partial --test mir_escaping_literals --test mir_borrow_flags --test mir_byvalue --test mir_concat --test mir_concat_chains --test mir_midpoint --test mir_generic_own_self --test mir_default_generic_shadow --test mir_let_else_temp --test mir_map_hash --test mir_scrutinee_parts --test mir_disjoint_field_capture --test run_v2 --test build_v2 --test test_v2 --test mir_map_walk_order --test mir_map_lazy_walk --test mir_map_entry_insert --test mir_reactor --test mir_cancel --test mir_fn_values_suspend --test mir_fn_value_lent --test mir_timeout --test mir_isolating_built --test mir_sync_counts --test mir_pool --test mir_map_missing_key --test mir_closure_results --test mir_debug_info_tasks --test mir_frame_narrowing --test mir_string_of_int --test mir_sort_fused --test mir_ufcs --test mir_task_pool_lean --test mir_panic_free_floor --test mir_dyn --test mir_dyn_tables --test core_dyn_tuple_element_coercion --test library_ordering_combinators --test mir_auto_par_stmt_chunks --test mir_auto_par_array_capture --test mir_auto_par_narrow_run --test mir_auto_par_range_facts --test mir_call_result_widening --test mir_unsolved_value_types --test mir_match_result_is_a_ref --test mir_qualified_generic_calls --test mir_operator_impl_choice --test mir_nil_coalesce_borrowed --test mir_provider_refusals --test mir_v1_service --test mir_provider_callbacks --test core_expected_type_tails --test core_supertrait_generic_defaults

  # M4 item 11: the pool (`KARAC_THREADS`) under ThreadSanitizer. The pool
  # goes on by default only once this job is green (review/m4-plan). It
  # builds the TSan runtime archive with std instrumented too (CLAUDE.md §
  # Runtime archives: against the precompiled std TSan cannot see a
  # `Mutex` lock and reports every guarded global), runs `tests/mir_tsan.rs`
  # (the instrument reports a race and stays quiet on a joined one), then the
  # task and `par` corpus on `karac __mir-llvm-tsan` with four workers.
  # NON-REQUIRED, like the other sanitizer legs.
  tsan:
    name: ThreadSanitizer (4 workers)
    runs-on: ubuntu-latest
    env:
      KARAC_REQUIRE_RUNTIME_ARCHIVE: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 18
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 llvm-18-dev
          echo "LLVM_SYS_181_PREFIX=$(llvm-config-18 --prefix)" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(llvm-config-18 --libdir)" >> "$GITHUB_ENV"

      # gcc's libtsan cannot map its shadow memory under the 32-bit mmap
      # randomisation of recent runner kernels ("unexpected memory mapping").
      - name: Narrow mmap randomisation for TSan
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add rust-src (the TSan archive rebuilds std)
        run: rustup component add rust-src

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: llvm-tsan

      - name: Build runtime staticlib archives (lean → full → tsan → tsan unicode)
        run: |
          cargo rustc -p karac-runtime --release --no-default-features --features net --crate-type staticlib
          cp target/release/libkarac_runtime.a target/release/libkarac_runtime_min.a
          cargo rustc -p karac-runtime --release --crate-type staticlib
          RUSTC_BOOTSTRAP=1 RUSTFLAGS=-Zsanitizer=thread cargo rustc -Zbuild-std=std,panic_abort --target x86_64-unknown-linux-gnu -p karac-runtime --release --target-dir target/tsan --crate-type staticlib
          cp target/tsan/x86_64-unknown-linux-gnu/release/libkarac_runtime.a target/release/libkarac_runtime_tsan.a
          RUSTC_BOOTSTRAP=1 RUSTFLAGS=-Zsanitizer=thread cargo rustc -Zbuild-std=std,panic_abort --target x86_64-unknown-linux-gnu -p karac-runtime --release --features unicode --target-dir target/tsan --crate-type staticlib
          cp target/tsan/x86_64-unknown-linux-gnu/release/libkarac_runtime.a target/release/libkarac_runtime_tsan_unicode.a
          rm -rf target/tsan

      # The instrument, then frozen handles counting nothing (B-2026-10-26-15).
      - name: TSan instrument tests
        run: cargo test --features llvm --test mir_tsan --test mir_frozen_uncounted --test mir_tsan_unicode

      - name: Build karac (llvm)
        run: cargo build --features llvm

      # The tagged task and par programs (and every concurrency fixture), bench
      # variants left out: their workloads do not finish under TSan. The step
      # fails on a ThreadSanitizer report only. The lane's other failures are
      # the mir-llvm lane's own, plus fixtures whose expected output pins the
      # one-worker order of prints from several tasks; both show in the log.
      # The instrument tests above fail if TSan cannot start at all, and the
      # `executed=` check fails a run that executed nothing.
      - name: Task and par corpus under TSan (4 workers)
        run: |
          python3 scripts/corpus/run.py --backend mir-llvm-tsan --quiet --timeout 300 --jobs 4 \
            --tag par --tag post-m1:par --tag stmt-par --tag concurrency --tag taskgroup \
            --tag channel --tag apps:service --filter concurrency --exclude bench \
            | tee tsan-corpus.log || true
          grep -q '^corpus-run backend=mir-llvm-tsan .* executed=[1-9]' tsan-corpus.log \
            || { echo "::error::the TSan corpus executed nothing"; exit 1; }
          if grep -E '^FAIL .*\(tsan: ' tsan-corpus.log; then
            echo "::error::ThreadSanitizer reported a race (lines above)"
            exit 1
          fi

  # The `--features llvm` codegen + producer-mode E2E on **Apple silicon
  # (arm64)** — the one non-x86_64, non-Linux leg that runs real binaries, so
  # it is the first step of the additive-interop "4-target CI matrix" (roadmap
  # Tier 5). It closes the standing "AArch64/Apple ABI unverified" caveat on
  # the `#[repr(C)]` enum slices (repr-c-tagged-union-enums.md): the all-unit
  # `int64_t` mapping and the scalar-payload tagged-union box both rest on the
  # SysV "one-eightbyte struct in one register" rule holding on AArch64 too —
  # this job is where that stops being an assumption. `macos-latest` IS arm64,
  # so no emulation. LLVM 18 comes from Homebrew's `llvm@18` (18.1.x, what
  # llvm-sys `181` wants); the dylib is found at test-runtime via
  # DYLD_FALLBACK_LIBRARY_PATH (SIP strips DYLD_LIBRARY_PATH from spawned
  # children, the fallback var survives). `cc` is clang, already present.
  #
  # Scope is the ABI-bearing subset, not the whole suite: the codegen E2E
  # oracle (general arm64 codegen/ABI: enum-payload word encoding, boxing,
  # struct returns) + the producer-mode cli tests (library artifacts + the
  # repr(C)-enum round-trips). NOT the JIT lane (a Linux-regression guard,
  # B-2026-07-07-5) and NOT the network/wasm cli tests (extra tooling).
  #
  # NON-REQUIRED until it has a green streak (mirrors `memory-sanitizer`): add
  # to branch protection only once stable, so a first-run macOS-toolchain
  # hiccup can't block the required gates.
  codegen-e2e-macos:
    name: Codegen E2E (macOS arm64, LLVM 18)
    runs-on: macos-latest
    env:
      # This job builds the runtime archives itself, so a link soft-skip here
      # can only mean the archive step broke — fail loudly instead of green-
      # skipping the E2E suite (project-review-2026-08-16 item 4; the absent-
      # archive half of the B-2026-07-28-1 vacuous-pass hole).
      KARAC_REQUIRE_RUNTIME_ARCHIVE: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 18 (Homebrew)
        run: |
          brew install llvm@18
          PREFIX="$(brew --prefix llvm@18)"
          echo "LLVM_SYS_181_PREFIX=$PREFIX" >> "$GITHUB_ENV"
          echo "DYLD_FALLBACK_LIBRARY_PATH=$PREFIX/lib" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: llvm-e2e-macos

      # Same lean→full archive dance as the Linux `codegen-e2e` job — the
      # real-binary E2E links these (without them the tests skip vacuously).
      # regex + arrow opt-in archives added alongside lean/full: with
      # KARAC_REQUIRE_RUNTIME_ARCHIVE=1 the Regex / Arrow-IPC E2E fixtures
      # hard-require them — before the gate they LOOKED covered but
      # green-skipped here (the archives were never built in CI, so those
      # tests never ran). Build order per CLAUDE.md § "Four archives": every
      # build emits the canonical name, so each rename happens before the
      # next build, and the plain full build runs LAST so the canonical
      # archive ends up as the non-opt-in full one.
      - name: Build runtime staticlib archives (lean → regex → arrow → unicode → full)
        run: |
          cargo rustc -p karac-runtime --release --no-default-features --features net --crate-type staticlib
          cp target/release/libkarac_runtime.a target/release/libkarac_runtime_min.a
          cargo rustc -p karac-runtime --release --features regex --crate-type staticlib
          cp target/release/libkarac_runtime.a target/release/libkarac_runtime_regex.a
          cargo rustc -p karac-runtime --release --features arrow --crate-type staticlib
          cp target/release/libkarac_runtime.a target/release/libkarac_runtime_arrow.a
          cargo rustc -p karac-runtime --release --features unicode --crate-type staticlib
          cp target/release/libkarac_runtime.a target/release/libkarac_runtime_unicode.a
          cargo rustc -p karac-runtime --release --crate-type staticlib

      # The v2 build and run on arm64: the AAPCS64 calling convention and
      # the arm64 linker see every program these targets build.
      - name: v2 E2E (arm64)
        run: cargo test --features llvm --test run_v2 --test build_v2 --test test_v2 --test mir_build --test mir_library

  # 4-target matrix STAGE 2 — Linux AArch64 (native `ubuntu-*-arm` runner, GA +
  # free for public repos). The SECOND arm64 execution leg: it runs the same
  # real binaries as `codegen-e2e-macos` but under the Linux AAPCS64 (vs Apple's
  # arm64 ABI), so it independently confirms the `#[repr(C)]` struct-by-value
  # coercion (B-2026-07-09-2) and would catch any Apple-vs-Linux ABI divergence
  # in it. Native arm64, so the real target classifier fires (no forced arch)
  # and the producer struct tests exercise it by execution. Same apt LLVM-18 +
  # lean→full archive setup as the x86-64 `codegen-e2e` job — just a different
  # `runs-on`. NON-REQUIRED until it has a green streak (mirrors the other
  # matrix legs).
  codegen-e2e-linux-arm64:
    name: Codegen E2E (Linux arm64, LLVM 18)
    runs-on: ubuntu-24.04-arm
    env:
      # This job builds the runtime archives itself, so a link soft-skip here
      # can only mean the archive step broke — fail loudly instead of green-
      # skipping the E2E suite (project-review-2026-08-16 item 4; the absent-
      # archive half of the B-2026-07-28-1 vacuous-pass hole).
      KARAC_REQUIRE_RUNTIME_ARCHIVE: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 18
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 llvm-18-dev
          echo "LLVM_SYS_181_PREFIX=$(llvm-config-18 --prefix)" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(llvm-config-18 --libdir)" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: llvm-e2e-linux-arm64

      # regex + arrow opt-in archives added alongside lean/full: with
      # KARAC_REQUIRE_RUNTIME_ARCHIVE=1 the Regex / Arrow-IPC E2E fixtures
      # hard-require them — before the gate they LOOKED covered but
      # green-skipped here (the archives were never built in CI, so those
      # tests never ran). Build order per CLAUDE.md § "Four archives": every
      # build emits the canonical name, so each rename happens before the
      # next build, and the plain full build runs LAST so the canonical
      # archive ends up as the non-opt-in full one.
      - name: Build runtime staticlib archives (lean → regex → arrow → unicode → full)
        run: |
          cargo rustc -p karac-runtime --release --no-default-features --features net --crate-type staticlib
          cp target/release/libkarac_runtime.a target/release/libkarac_runtime_min.a
          cargo rustc -p karac-runtime --release --features regex --crate-type staticlib
          cp target/release/libkarac_runtime.a target/release/libkarac_runtime_regex.a
          cargo rustc -p karac-runtime --release --features arrow --crate-type staticlib
          cp target/release/libkarac_runtime.a target/release/libkarac_runtime_arrow.a
          cargo rustc -p karac-runtime --release --features unicode --crate-type staticlib
          cp target/release/libkarac_runtime.a target/release/libkarac_runtime_unicode.a
          cargo rustc -p karac-runtime --release --crate-type staticlib

      # The v2 build and run on arm64: the AAPCS64 calling convention and
      # the arm64 linker see every program these targets build.
      - name: v2 E2E (arm64)
        run: cargo test --features llvm --test run_v2 --test build_v2 --test test_v2 --test mir_build --test mir_library

  # NOTE ON DROPPED MATRIX LEGS
  #
  # Two of the originally-planned CI matrix legs are absent by decision:
  #
  # STAGE 3 (Codegen E2E on macOS x86_64, Intel `macos-13`) — dropped
  # 2026-07-09. Only covered the intersection of two things the matrix
  # already tests: x86-64 codegen+execution (the `codegen-e2e` job on
  # ubuntu-latest, ELF/SysV) and the macOS producer link path
  # (`codegen-e2e-macos` on arm64, Mach-O). Added no unique coverage, and
  # the scarce `macos-13` Intel runners left it queued for 1h+ without
  # allocating.
  #
  # STAGE 4 (Codegen E2E on windows-latest with LLVM 18) — deferred
  # 2026-07-10. `llvm-sys 181`'s build script requires `llvm-config.exe`
  # at `<PREFIX>/bin/`, and the official LLVM Windows NSIS installer
  # (and every downstream repackaging: Chocolatey `llvm`,
  # `KyleMayes/install-llvm-action`, direct download) OMITS
  # `llvm-config.exe` — a long-standing upstream gap the LLVM project
  # has not resolved. Verified in-tree: a probe run against the extracted
  # LLVM 18.1.8 Windows install (`D:\a\_temp\llvm`) found `clang-*.exe`,
  # `lld*.exe`, headers, and libs, but NO `llvm-config*`. Alternatives
  # each have their own cost: hand-crafting an `llvm-config.bat` shim is
  # fragile against future llvm-sys flag additions and needs perpetual
  # maintenance; MSYS2/MinGW LLVM includes `llvm-config` but is
  # ABI-incompatible with our MSVC-toolchain Rust build; from-source
  # LLVM adds ~1h to every push.
  # Reinstate this leg once one of: (a) LLVM ships `llvm-config.exe` on
  # Windows, (b) an accepted community LLVM Windows redistribution
  # includes it, or (c) someone signs up to maintain the shim. The
  # matrix is currently **3 execution targets** (Linux x86-64, Linux
  # arm64, macOS arm64) + the `windows-lint` clippy job + the standard
  # `Test (windows-latest)` non-LLVM workspace suite for Windows-side
  # coverage that doesn't require llvm-sys.

  # ── Phase 6.3 Slice 7: flagship-demo benchmark regression gate ──────────
  # Builds the `ws_idle_holder` flagship demo (Demo 1) with `karac build`,
  # runs the Rust bench harness against it at a CI-appropriate load tier
  # (a few thousand loopback connections + churn — CI cannot hold the 1M+
  # of the canonical rig in examples/ws_idle_holder/bench/REPORT.md), and
  # gates the run against a committed baseline: connection-establishment
  # latency percentiles (p50/p95/p99/p99.9), idle per-connection memory
  # density, and the P99 churn cliff. Correctness (every connection
  # established, zero connect/reconnect failures) is a HARD gate; a
  # >tolerance regression fails the job but is overridable with a
  # `[bench-override: <reason>]` token in the head commit message. Latency
  # on a shared runner is noisy, so its baseline tolerances are wide and the
  # deterministic sentinel is per-conn memory density (scale- &
  # machine-invariant). Same LLVM-18 + native-archive setup as `codegen-e2e`.
  # Deliberately a SEPARATE, NON-required job (not in branch protection)
  # until it builds a green streak — a noisy latency false-positive must not
  # block the required gates. Slice 7 detail + the load-tier rationale:
  # docs/implementation_checklist/phase-6-runtime.md.
  bench-gate:
    name: Flagship demo bench gate (Demo 1)
    # Skipped until M4a: the demo is a WebSocket server, which v2 refuses by
    # name until the services track lands, and the legacy pipeline that
    # built it went at M3. Re-enable by deleting this line.
    if: false
    runs-on: ubuntu-latest
    env:
      # This job builds the runtime archives itself, so a link soft-skip here
      # can only mean the archive step broke — fail loudly instead of green-
      # skipping the E2E suite (project-review-2026-08-16 item 4; the absent-
      # archive half of the B-2026-07-28-1 vacuous-pass hole).
      KARAC_REQUIRE_RUNTIME_ARCHIVE: "1"

    steps:
      - uses: actions/checkout@v4

      # Gate-logic self-test first — fast, no build. If the gate script's own
      # logic regresses, fail here before spending minutes on the LLVM build.
      - name: Bench gate self-test
        run: python3 examples/ws_idle_holder/bench/scripts/bench_gate.py --selftest

      - name: Install LLVM 18
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 llvm-18-dev
          echo "LLVM_SYS_181_PREFIX=$(llvm-config-18 --prefix)" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(llvm-config-18 --libdir)" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: bench-gate

      # The demo is built by `karac build` and links the runtime staticlib;
      # lean first, copied to the `_min` sibling, THEN full overwrites the
      # canonical name (CLAUDE.md § "Four archives").
      - name: Build runtime staticlib archives (lean → full)
        run: |
          cargo rustc -p karac-runtime --release --no-default-features --features net --crate-type staticlib
          cp target/release/libkarac_runtime.a target/release/libkarac_runtime_min.a
          cargo rustc -p karac-runtime --release --crate-type staticlib

      - name: Build karac (LLVM backend)
        run: cargo build --bin karac --features llvm

      - name: Build the ws_idle_holder demo (karac build)
        working-directory: examples/ws_idle_holder
        run: |
          KARAC_RUNTIME="$PWD/../../target/release/libkarac_runtime.a" \
            ../../target/debug/karac build
          test -x ws_idle_holder

      - name: Build the bench harness
        working-directory: examples/ws_idle_holder/bench
        run: cargo build --release

      # Lift an override token out of the head commit message, if present:
      # `[bench-override: some reason]` -> BENCH_GATE_OVERRIDE="some reason".
      # A regression then downgrades to a warning (correctness stays hard).
      - name: Extract bench-override token
        run: |
          msg=$(git log -1 --pretty=%B)
          reason=$(printf '%s\n' "$msg" | sed -n 's/.*\[bench-override:[[:space:]]*\(.*\)\].*/\1/p' | head -1)
          if [ -n "$reason" ]; then
            echo "BENCH_GATE_OVERRIDE=$reason" >> "$GITHUB_ENV"
            echo "::warning::bench gate override present: $reason"
          fi

      # CI load tier — a few thousand loopback conns + churn (see the baseline
      # `tier` block). Raise the fd limit: ~2 sockets/conn across client+server
      # in one box. Small enough to finish in seconds and stay stable on a
      # shared runner; large enough to exercise the latency percentiles,
      # per-conn density, and the churn cliff. `|| true` so a non-`ok` run
      # (which still prints its JSON) is judged by the gate, not swallowed here.
      - name: Run bench harness (CI tier)
        run: |
          ulimit -n 1048576 2>/dev/null || ulimit -n 262144 2>/dev/null || true
          ./examples/ws_idle_holder/bench/target/release/ws-idle-holder-bench \
            --server-bin examples/ws_idle_holder/ws_idle_holder \
            -n 2000 --concurrency 200 \
            --churn-rounds 3 --churn-fraction 0.1 \
            --hold-secs 2 \
            > bench-report.json || true
          test -s bench-report.json || { echo "::error::harness produced no JSON report"; exit 1; }
          cat bench-report.json

      - name: Gate against baseline
        run: |
          python3 examples/ws_idle_holder/bench/scripts/bench_gate.py \
            --report bench-report.json \
            --baseline examples/ws_idle_holder/bench/scripts/bench_baseline.json

      - name: Upload bench report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws-idle-holder-bench-report
          path: bench-report.json

  cross:
    name: Cross-compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Cross-compile
        run: cross build --target ${{ matrix.target }}

      # Phase-10 v64 P0 (TLS-provider cross-compile gate): `cross build`
      # above only builds the root `karac` package — its rustls dep is
      # dev-only, so the step compiles ZERO TLS code. The runtime's
      # default `tls` feature (rustls + ring, incl. ring's C objects via
      # the cross image's C toolchain) is the thing the v1 target matrix
      # must prove, so build it explicitly.
      - name: Cross-compile runtime (tls feature tree)
        run: cross build --target ${{ matrix.target }} -p karac-runtime

  # Phase-10 v64 P0 — TLS-provider cross-compile gate for the v1 targets
  # the full runtime can't reach yet (tokio/mio/hyper don't compile on
  # wasm32 / bare metal). Gates rustls + ring in isolation via the
  # `runtime/tls-cross-probe/*` workspace members; per-target feature
  # recipes live in those crates' Cargo.toml headers. Native legs are
  # covered elsewhere: linux/macos/windows by `test` (workspace default
  # `tls`), linux aarch64/armv7 by `cross` above, macOS x86_64 here.
  #
  # The cortex-m leg is a NEGATIVE gate (`expect_unsupported`): ring's
  # curve25519 ARM assembly (x25519-asm-arm.S) is ARM-mode-only and
  # cortex-m is Thumb-only, so the provider cannot assemble there — an
  # ISA limitation, not a toolchain gap (the arm-none-eabi sysroot is
  # installed and headers resolve; the .S file itself rejects -mthumb).
  # The leg asserts the failure is still exactly ring's C/asm build: it
  # FAILS LOUDLY if the probe ever starts compiling (ecosystem caught
  # up — flip to a real gate) or fails for any other reason. Decision
  # record: phase-10-targets.md § "Embedded TLS provider decision".
  tls-cross:
    name: TLS cross-compile (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: wasm32-browser
            runner: ubuntu-latest
            target: wasm32-unknown-unknown
            package: karac-tls-cross-probe
          - name: wasm32-wasi
            runner: ubuntu-latest
            target: wasm32-wasip1
            package: karac-tls-cross-probe
          - name: cortex-m
            runner: ubuntu-latest
            target: thumbv7em-none-eabihf
            package: karac-tls-cross-probe-embedded
            expect_unsupported: true
          - name: macos-x86_64
            runner: macos-latest
            target: x86_64-apple-darwin
            # Apple-silicon runner cross-checks the x86_64 slice of the
            # FULL runtime tls tree (same SDK, different arch) — no
            # probe indirection needed on this leg.
            package: karac-runtime

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # `rust-toolchain.toml` pins the toolchain repo-wide, so the `cargo
      # check` below runs on the PINNED toolchain — not the `stable` the
      # action installed the target onto. Add the matrix target to the
      # pinned toolchain explicitly (the override file makes this `rustup`
      # target the pinned one), or `cargo check` dies with E0463 "can't
      # find crate for `core`". The wasm-wasi leg survives without this only
      # because its target is already in `rust-toolchain.toml`'s `targets`.
      - name: Add target to pinned toolchain
        run: rustup target add ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # ring's build.rs compiles C for the target. Ubuntu's clang handles
      # the wasm32 triples out of the box; bare-metal ARM needs the
      # arm-none-eabi toolchain for its newlib sysroot (plain clang dies
      # on `'assert.h' file not found`).
      - name: Install ARM embedded toolchain
        if: matrix.target == 'thumbv7em-none-eabihf'
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi

      - name: Check TLS provider for target
        if: ${{ !matrix.expect_unsupported }}
        env:
          CC_wasm32_unknown_unknown: clang
          CC_wasm32_wasip1: clang
        run: cargo check -p ${{ matrix.package }} --target ${{ matrix.target }}

      - name: Check TLS provider is still known-unsupported (negative gate)
        if: ${{ matrix.expect_unsupported }}
        env:
          CC_thumbv7em_none_eabihf: arm-none-eabi-gcc
        run: |
          set -o pipefail
          if cargo check -p ${{ matrix.package }} --target ${{ matrix.target }} 2>&1 | tee /tmp/tls-cross.log; then
            echo "::error::${{ matrix.name }}: the TLS provider now COMPILES for ${{ matrix.target }} — the ecosystem caught up. Drop expect_unsupported to flip this leg to a real gate, and resolve the phase-10 'Embedded TLS provider decision' entry."
            exit 1
          fi
          if ! grep -q 'failed to run custom build command for `ring' /tmp/tls-cross.log; then
            echo "::error::${{ matrix.name }}: probe failed for an UNEXPECTED reason (not ring's C/asm build) — investigate; do not paper over a new failure with this negative gate."
            tail -50 /tmp/tls-cross.log
            exit 1
          fi
          echo "${{ matrix.name }}: known-unsupported, as documented — ring's ARM-mode asm (x25519-asm-arm.S) cannot assemble for the Thumb-only ${{ matrix.target }}. See phase-10 'Embedded TLS provider decision'."

  # Phase-8 line 48 (public-CA trust default). Proves the runtime's
  # `Client.get("https://...")` validates a real CA-signed peer cert
  # using the embedded `webpki-roots` bundle — without relying on a
  # system CA store. Builds the runtime's test binary inside
  # `rust:alpine` (with `ca-certificates` present so cargo can fetch
  # crates.io), then removes `ca-certificates` BEFORE running the test
  # so the OS CA store can't be the thing that's working. The test
  # (`tests::test_https_round_trip_against_public_origin`) hits
  # `https://example.com/` and asserts a successful TLS handshake +
  # any non-zero HTTP status.
  stripped-image-https:
    name: HTTPS without system CA (stripped Alpine)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run HTTPS round-trip in rust:alpine with ca-certificates removed
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            rust:alpine sh -eu -c '
              # Build deps the runtime needs (musl-dev for libc headers,
              # gcc as the C linker). rust:alpine ships ca-certificates
              # baked in — needed to fetch crates from crates.io.
              apk add --no-cache musl-dev gcc

              # Compile (no run) — cargo fetch + build still need
              # ca-certificates reachable to talk to crates.io.
              cargo test --no-run -p karac-runtime --lib --release

              # Strip the OS CA trust store BEFORE the test runs. Alpine
              # splits trust material across two packages: `ca-certificates`
              # (just the update-ca-certificates tooling) and
              # `ca-certificates-bundle` (which actually owns
              # /etc/ssl/certs/ca-certificates.crt and /etc/ssl/cert.pem).
              # Removing only `ca-certificates` leaves the bundle in place,
              # so remove both — then `rm -f` the bundle files directly as a
              # backstop, since a reverse-dep can pin `ca-certificates-bundle`
              # and block its removal. `|| true` keeps a refused apk del from
              # aborting under `sh -e`. From here the only trust anchors
              # available to TLS are whatever the runtime embeds in its
              # rustls config.
              apk del ca-certificates ca-certificates-bundle || true
              rm -f /etc/ssl/certs/ca-certificates.crt /etc/ssl/cert.pem
              for f in /etc/ssl/certs/ca-certificates.crt /etc/ssl/cert.pem; do
                if [ -e "$f" ]; then
                  echo "::error::OS CA trust store still present at $f; test premise broken"
                  exit 1
                fi
              done

              # Locate the just-built test binary and run only the
              # ignored HTTPS smoke test.
              BIN=$(find target/release/deps -maxdepth 1 -type f -name "karac_runtime-*" ! -name "*.d" -perm -111 | head -1)
              if [ -z "$BIN" ]; then
                echo "::error::karac-runtime test binary not found under target/release/deps"
                exit 1
              fi
              "$BIN" --exact \
                tests::test_https_round_trip_against_public_origin \
                --include-ignored --nocapture
            '

  # ── Supply chain ───────────────────────────────────────────────────
  # `karac` compiles other people's code, so its ~350-crate dependency
  # tree is part of its threat model: a compromised transitive crate runs
  # on every machine that builds a Kāra program. Nothing in this repo
  # checked that tree against RUSTSEC before this job — `cargo build`
  # will happily link a crate with a live advisory.
  #
  # Config (and the rationale for which checks block vs. warn) lives in
  # `deny.toml`. Advisories, licenses, and sources are blocking; the
  # duplicate-version lint is a warning because the arrow / tokio trees
  # legitimately carry several versions of small helper crates.
  #
  # This job covers what a diff introduces. It cannot cover an advisory
  # published against a lockfile nobody is touching — no push, no run. The
  # nightly `.github/workflows/supply-chain.yml` is the other half; the two
  # invocations are intentionally identical, so change them together.
  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          # `advisories` alone would pass a tree that swapped crates.io
          # for an unknown registry, so run the full set the config
          # defines.
          arguments: --all-features

  # ── MSRV floor ─────────────────────────────────────────────────────
  # `[workspace.package] rust-version` claims an oldest-supported rustc, and
  # every member inherits it. Nothing else in this file verifies that claim:
  # all the other jobs run the toolchain `rust-toolchain.toml` pins, and the
  # pin sits AT the floor — so a stray use of a newer language or std feature
  # compiles green here and only breaks for someone building on the declared
  # minimum. That makes the field a guess unless something builds on it.
  #
  # The floor is read from the manifest rather than hardcoded, so this gate
  # cannot drift out of step with what the crate advertises: bump
  # `rust-version` and the next run checks the new value. `RUSTUP_TOOLCHAIN`
  # overrides `rust-toolchain.toml` — the same mechanism `stable-drift` uses
  # below, pointed the other way (oldest supported vs. newest available).
  #
  # This one blocks. A red run means the declared floor became false, and the
  # fix is a deliberate choice — raise `rust-version`, or hold the dependency
  # that raised it — not something to discover downstream.
  #
  # Scope: default features. `--features llvm` needs system LLVM and is
  # covered by `codegen-e2e` on the pinned toolchain.
  msrv:
    name: MSRV floor (declared rust-version)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve the declared MSRV
        id: msrv
        run: |
          set -euo pipefail
          # Only `[workspace.package]` declares a literal; members inherit
          # with `rust-version.workspace = true`, which this pattern skips.
          msrv=$(grep -oP '^rust-version = "\K[^"]+' Cargo.toml | head -1 || true)
          if [ -z "$msrv" ]; then
            echo "::error file=Cargo.toml::no literal rust-version in [workspace.package]"
            exit 1
          fi
          # rustup wants a full x.y.z; a two-component MSRV means ".0" — the
          # first release of that minor, which is the actual floor.
          case "$msrv" in
            *.*.*) toolchain="$msrv" ;;
            *)     toolchain="$msrv.0" ;;
          esac
          echo "declared MSRV: $msrv  ->  toolchain $toolchain"
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"

      # rustup ships on the runner image, so no action is needed here — and
      # passing an arbitrary version to `dtolnay/rust-toolchain` would mean
      # referencing it at `@master`, a floating ref in a job whose whole
      # point is pinning.
      - name: Install the floor toolchain
        run: rustup toolchain install '${{ steps.msrv.outputs.toolchain }}' --profile minimal

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check at the floor
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.toolchain }}
        run: |
          rustc --version
          cargo check --all --all-targets

  # ── Toolchain drift canary ─────────────────────────────────────────
  # `rust-toolchain.toml` pins the toolchain so that rustfmt output, the
  # clippy lint set, and the size/speed baselines are reproducible. The
  # cost of pinning is that a new rustc release is invisible until
  # someone bumps the pin — and then all of its breakage arrives at once,
  # usually in the middle of an unrelated slice.
  #
  # This job is the other half of that trade: it builds, tests, and lints
  # on floating `stable` (RUSTUP_TOOLCHAIN overrides the file), so an
  # incompatibility shows up the week it ships. It is deliberately
  # `continue-on-error` — a rustc release must never redden the merge
  # queue. A red run here is a scheduling signal, not a blocker: bump the
  # pin deliberately, in its own commit.
  stable-drift:
    name: Toolchain drift canary (floating stable)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      RUSTUP_TOOLCHAIN: stable

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Report the toolchain under test
        run: |
          echo "pinned:   $(grep -oP 'channel = "\K[^"]+' rust-toolchain.toml)"
          echo "floating: $(rustc --version)"

      - name: Build
        run: cargo build --all

      - name: Test
        run: cargo test --all

      - name: Clippy
        run: cargo clippy --all --all-targets -- -D warnings

      # Formatting is the most version-sensitive of the three gates —
      # rustfmt's output changes across releases, and `--check` is a hard
      # pre-commit gate on the pinned toolchain. Surfacing the diff here
      # (without failing) is what makes a pin bump a known quantity
      # instead of a surprise `cargo fmt` churn commit.
      - name: Formatting delta vs. the pinned toolchain
        run: cargo fmt --all -- --check
